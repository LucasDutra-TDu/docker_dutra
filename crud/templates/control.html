{% extends 'layout.html' %}
{% block body %}
<div class="row">
  <div class="col-md-6 offset-md-3">
    <div class="card card-body">
      <h3>Control de Nodos MQTT</h3>
      <form action="{{ url_for('control_nodos') }}" method="POST">
        <div class="mb-3">
          <label for="nodo" class="form-label">Seleccionar Nodo:</label>
          <select name="nodo" id="nodo" class="form-select" required>
            {% for nodo in nodos %}
            <option value="{{ nodo }}">{{ nodo }}</option>
            {% endfor %}
          </select>
        </div>

        <hr>
        
        <div class="mb-3">
          <h5>Destello LED</h5>
          <button type="submit" name="comando" value="destello" class="btn btn-warning w-100">Destellar</button>
        </div>

        <hr>

        <div class="mb-3">
          <h5>Setpoint</h5>
          <div class="input-group">
            <input type="number" step="0.1" name="valor" class="form-control" placeholder="Ej: 24.5">
            <button type="submit" name="comando" value="setpoint" class="btn btn-primary">Fijar Setpoint</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
